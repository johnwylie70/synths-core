[package]
name = "synths-core"
version = "0.0.0"
edition = "2021"
description = "The sound engine behind synths.js and synths: synth voices, samples, effects and a tracker song player, as one core that builds for the web (WebAssembly) and for native apps."
license = "MIT"
authors = ["John Wylie"]
repository = "https://github.com/johnwylie70/synths-core"
publish = false

[lib]
# cdylib: the WebAssembly module the audio worklet loads
# staticlib: linked into a native app (iOS)
# rlib: tests, and other Rust code
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["json"]
# Reading and writing songs as JSON (docs/song-format.md). The WebAssembly
# build leaves it out: a host there reads JSON for nothing, and hands the
# engine the packed form of the song instead.
json = []

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Tests render a lot of sound, so they are compiled for speed; they keep
# their checks for overflow and out-of-range indexes.
[profile.test]
opt-level = 2
